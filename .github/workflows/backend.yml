name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app --output-format=github

      - name: Verify application imports cleanly
        env:
          GEMINI_API_KEY: "ci-placeholder-key"
        run: python -c "from app.main import app; print('CoralAI backend imports OK')"
