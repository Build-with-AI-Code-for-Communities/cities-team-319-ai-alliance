services:
  - type: web
    name: coral-ai-backend
    runtime: python
    plan: free
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false # set to your deployed Vercel frontend URL, e.g. https://coral-ai.vercel.app
      - key: DATABASE_URL
        sync: false # paste your Neon Postgres connection string
      - key: GEMINI_API_KEY
        sync: false # https://aistudio.google.com/apikey
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Defaults to local disk storage — zero setup, works immediately. Uploaded
      # images/PDFs won't survive a redeploy, but survey data in Neon always does.
      # To switch to S3-compatible storage (Cloudflare R2, Backblaze B2, AWS S3)
      # later: change this to "s3" and add S3_ENDPOINT_URL, S3_BUCKET_NAME,
      # S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY as extra env vars in the Render
      # dashboard (see docs/deployment.md).
      - key: STORAGE_BACKEND
        value: local
      - key: NASA_SST_ENABLED
        value: "false"
      - key: NASA_API_KEY
        sync: false
